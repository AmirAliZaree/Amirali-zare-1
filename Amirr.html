<!DOCTYPE html>

<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AmirAli Zare</title>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0d192e 0%, #080c14 70%, #03060a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      position: relative;
    }

    /* بوم ذرات شناور متحرک در پس‌زمینه */
    #particlesCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* انیمیشن لرزش ملایم مخصوص دکمه ورود به سایت */
    @keyframes btnShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-2px, 2px) rotate(-0.5deg); }
      40% { transform: translate(2px, -2px) rotate(0.5deg); }
      60% { transform: translate(-1px, -2px) rotate(-0.3deg); }
      80% { transform: translate(2px, 1px) rotate(0.3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* صفحه ورود اولیه با قابلیت محو شدن بسیار آهسته و ملایم */
    #welcomeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #080c14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      opacity: 1;
      visibility: visible;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* حالت فید اوت بسیار نرم و طولانی */
    #welcomeOverlay.fade-out {
      opacity: 0;
      transform: scale(1.08);
      visibility: hidden;
    }

    /* کانتینر ثابت و شیشه‌ای */
    .welcome-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    /* دکمه ورود به سایت که لرزش دارد */
    .enter-btn {
      padding: 15px 40px;
      background: rgba(56, 189, 248, 0.15);
      border: 2px solid rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      font-size: 18px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
      letter-spacing: 1px;
      pointer-events: none;
      display: inline-block;
      animation: btnShake 0.6s infinite ease-in-out;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .welcome-card:hover .enter-btn {
      background: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.8), inset 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 30px 20px 75px;
      position: relative;
      z-index: 10;
    }

    /* بخش بالای صفحه شامل آیکون‌ها و متن وسط آن‌ها */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 320px;
      padding: 0 10px;
    }

    /* استایل آیکون‌های شیشه‌ای و نورانی */
    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(56, 189, 248, 0.1);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .social-icon:hover {
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.3);
      transform: scale(1.08);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* متن وسط بین دو آیکون */
    .header-center-text {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
    }

    /* استایل کپسول لوکیشن (Tabriz) */
    .location-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2), inset 0 0 8px rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      transition: all 0.3s ease;
    }

    .location-badge:hover {
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transform: scale(1.05);
    }

    .location-badge svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      flex: 1;
      justify-content: center;
    }

    /* بخش پروفایل و عنوان زیر آن */
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* پروفایل دایره‌ای */
    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
      background-color: #0f172a;
      background-image: linear-gradient(135deg, #1e293b, #0f172a);
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* متن کوچک زیر پروفایل */
    .profile-title {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* افکت متن WAVE */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-text {
      display: flex;
      gap: 12px;
    }

    .letter {
      font-size: 75px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
      display: inline-block;
      will-change: transform;
    }

    /* پلیر موزیک با قابلیت چند آهنگ و دکمه بعدی */
    .music-player {
      width: 100%;
      max-width: 340px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1);
    }

    /* دکمه‌های کنترلی پلیر */
    .player-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .control-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      transform: scale(1.05);
    }

    .control-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* اطلاعات آهنگ و نوار پیشرفت */
    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    .track-title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* اکولایزر نئونی متحرک (Equalizer Visualizer) */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 13px;
      padding: 0 1px;
    }

    .eq-bar {
      width: 2.5px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to top, #38bdf8, #a855f7);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.7);
      transition: height 0.25s ease, opacity 0.25s ease;
    }

    /* انیمیشن جهش نوارهای اکولایزر هنگام پخش موزیک */
    .equalizer.active .eq-bar {
      animation: eqBounce 1s ease-in-out infinite alternate;
    }

    .equalizer.active .eq-bar:nth-child(1) {
      animation-duration: 0.75s;
      animation-delay: 0.05s;
    }
    .equalizer.active .eq-bar:nth-child(2) {
      animation-duration: 0.55s;
      animation-delay: 0.2s;
    }
    .equalizer.active .eq-bar:nth-child(3) {
      animation-duration: 0.9s;
      animation-delay: 0.35s;
    }
    .equalizer.active .eq-bar:nth-child(4) {
      animation-duration: 0.65s;
      animation-delay: 0.1s;
    }
    .equalizer.active .eq-bar:nth-child(5) {
      animation-duration: 0.8s;
      animation-delay: 0.25s;
    }

    @keyframes eqBounce {
      0% {
        height: 3px;
        box-shadow: 0 0 4px rgba(56, 189, 248, 0.5);
      }
      50% {
        height: 13px;
        box-shadow: 0 0 8px rgba(168, 85, 247, 0.9), 0 0 12px rgba(56, 189, 248, 0.7);
      }
      100% {
        height: 5px;
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.7);
      }
    }

    /* نوار پیشرفت آهنگ */
    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(56, 189, 248, 0.2);
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      transition: width 0.1s linear;
    }
  </style>
</head>

</div><script>
  (function initVolumeControls() {
    const audio = document.getElementById('audioPlayer');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeIcon = document.getElementById('volumeIcon');
    let lastVolume = 0.8;

    if (audio) {
      audio.volume = 0.8;
    }

    function updateSliderGradient(val) {
      const percent = val * 100;
      volumeSlider.style.background = `linear-gradient(to right, #38bdf8 0%, #a855f7 ${percent}%, rgba(56, 189, 248, 0.2) ${percent}%, rgba(56, 189, 248, 0.2) 100%)`;
    }

    function updateVolumeIcon(vol) {
      if (vol === 0) {
        // Muted
        volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if (vol < 0.5) {
        // Low volume
        volumeIcon.innerHTML = '<path d="M7 9v6h4l5 5V4L11 9H7z"/><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
      } else {
        // High volume
        volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    }

    window.onVolumeChange = function(e) {
      const val = parseFloat(e.target.value);
      if (audio) audio.volume = val;
      if (val > 0) lastVolume = val;
      updateVolumeIcon(val);
      updateSliderGradient(val);
    };

    window.toggleMute = function() {
      if (!audio) return;
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
        updateVolumeIcon(0);
        updateSliderGradient(0);
      } else {
        const restoreVol = lastVolume > 0 ? lastVolume : 0.8;
        audio.volume = restoreVol;
        volumeSlider.value = restoreVol;
        updateVolumeIcon(restoreVol);
        updateSliderGradient(restoreVol);
      }
    };

    updateSliderGradient(0.8);
  })();
</script>
<audio id="audioPlayer" preload="auto"></audio>
<script>
    // سیستم ذرات تعاملی پس‌زمینه (Interactive Background Particles) با ترکیب نئون آبی و بنفش
    const canvas = document.getElementById('particlesCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 55;
    const maxDistance = 110;
    const mouse = { x: null, y: null, radius: 130 };

    // پالت رنگ‌های نئونی ترکیبی (Cyan & Purple/Magenta)
    const colorThemes = [
      { r: 56, g: 189, b: 248, hex: '#38bdf8' },  // Neon Sky Cyan
      { r: 6, g: 182, b: 212, hex: '#06b6d4' },   // Neon Turquoise
      { r: 168, g: 85, b: 247, hex: '#a855f7' },  // Neon Purple
      { r: 192, g: 132, b: 252, hex: '#c084fc' }  // Neon Bright Magenta/Violet
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.baseX = this.x;
        this.baseY = this.y;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.5) * 0.7;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.color = colorThemes[Math.floor(Math.random() * colorThemes.length)];
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color.hex;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        // واکنش ملایم به ماوس
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            const dirX = dx / dist;
            const dirY = dirX ? dirX : 0;
            const dirYActual = dy / dist;
            this.x -= dirX * force * 1.5;
            this.y -= dirYActual * force * 1.5;
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i];
          const p2 = particles[j];
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDistance) {
            const lineOpacity = (1 - dist / maxDistance) * 0.28;
            const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            grad.addColorStop(0, `rgba(${p1.color.r}, ${p1.color.g}, ${p1.color.b}, ${lineOpacity})`);
            grad.addColorStop(1, `rgba(${p2.color.r}, ${p2.color.g}, ${p2.color.b}, ${lineOpacity})`);

            ctx.beginPath();
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1;
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.update();
        p.draw();
      });
      connectParticles();
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // انیمیشن متن RIMA
    const letters = document.querySelectorAll('.letter');
    let time = 0;

    function animate() {
      time += 0.04;
      letters.forEach((letter, index) => {
        const yOffset = Math.sin(time + index * 0.8) * 20;
        const rotate = Math.cos(time + index * 0.8) * 8;
        letter.style.transform = `translateY(${yOffset}px) rotate(${rotate}deg)`;
      });
      requestAnimationFrame(animate);
    }

    animate();

    const playlist = [
      { name: "Music 1", src: "" },
      { name: "Music 2", src: "" },
      { name: "Music 3", src: "" }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressBar = document.getElementById('progressBar');
    const trackTitle = document.getElementById('trackTitle');
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const equalizer = document.getElementById('equalizer');

    let isPlaying = true;

    function setEqualizerState(active) {
      if (active) {
        equalizer.classList.add('active');
      } else {
        equalizer.classList.remove('active');
      }
    }

    function loadTrack(index) {
      audio.src = playlist[index].src;
      trackTitle.textContent = playlist[index].name;
    }

    loadTrack(currentTrackIndex);

    function startSite() {
      welcomeOverlay.classList.add('fade-out');
      setTimeout(() => {
        welcomeOverlay.style.display = 'none';
      }, 1500);
      isPlaying = true;
      setEqualizerState(true);
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function togglePlay() {
      if (isPlaying) {
        isPlaying = false;
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        setEqualizerState(false);
      } else {
        isPlaying = true;
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        setEqualizerState(true);
      }
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      setEqualizerState(true);
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    function seekAudio(e) {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  </script>
