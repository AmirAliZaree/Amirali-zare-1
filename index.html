<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <!-- Disable user scaling, zooming, and viewport resizing behavior -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>WAVE Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* Lock html and body dimensions to 100% fixed screen area */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
            touch-action: none; /* Prevents touch gestures like pinch zoom & pull-to-refresh */
            background-color: #0b0e14;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Container font and base layout */
        .wave-text-container {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glowing text styling matching the reference video */
        .glow-letter {
            display: inline-block;
            color: #38bdf8;
            text-shadow: 
                0 0 12px rgba(56, 189, 248, 0.9),
                0 0 30px rgba(56, 189, 248, 0.7),
                0 0 60px rgba(14, 165, 233, 0.5),
                0 0 100px rgba(14, 165, 233, 0.3);
            will-change: transform;
            line-height: 1;
        }

        /* Fixed ambient light glow centered behind the text */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50vw;
            height: 50vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(14, 165, 233, 0.03) 55%, transparent 70%);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(30px);
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- Soft background halo glow -->
    <div class="ambient-glow"></div>

    <!-- Centered Fixed Text Wrapper -->
    <main class="relative z-10 flex items-center justify-center w-full h-full">
        <!-- Text sized using container-relative clamp so it stays visually proportional on all screen sizes -->
        <div id="textContainer" class="wave-text-container gap-[2vw] md:gap-[1.5vw] text-[18vw] sm:text-[15vw] md:text-[13vw] lg:text-[11vw] font-black tracking-wider">
            <!-- Letters generated dynamically -->
        </div>
    </main>

    <script>
        // Prevent all user scaling & scrolling shortcuts
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        const textContainer = document.getElementById('textContainer');
        const text = "WAVE";
        let letterElements = [];
        let time = 0;

        // Build letter nodes
        function initText() {
            textContainer.innerHTML = '';
            letterElements = [];

            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char;
                span.className = 'glow-letter';
                textContainer.appendChild(span);
                letterElements.push({
                    element: span,
                    index: index
                });
            });
        }

        // Smooth wave motion loop
        function animateWave() {
            time += 0.04;

            letterElements.forEach((item) => {
                // Harmonic wave math formula for smooth continuous movement
                const phase = item.index * 0.7;
                const yOffset = Math.sin(time + phase) * 22; // Wave amplitude height
                const rotation = Math.cos(time + phase) * 5;  // Slight character tilt angle

                item.element.style.transform = `translate3d(0, ${yOffset}px, 0) rotate(${rotation}deg)`;
            });

            requestAnimationFrame(animateWave);
        }

        window.onload = () => {
            initText();
            animateWave();
        };
    </script>
</body>
</html>
