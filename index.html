<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>  AmirAli Zare  </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    /* انیمیشن لرزش ملایم مخصوص دکمه ورود به سایت */
    @keyframes btnShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-2px, 2px) rotate(-0.5deg); }
      40% { transform: translate(2px, -2px) rotate(0.5deg); }
      60% { transform: translate(-1px, -2px) rotate(-0.3deg); }
      80% { transform: translate(2px, 1px) rotate(0.3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* صفحه ورود اولیه با قابلیت محو شدن بسیار آهسته و فوق‌العاده ملایم (۲.۵ ثانیه) */
    #welcomeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #080c14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      opacity: 1;
      visibility: visible;
      transition: opacity 2.5s cubic-bezier(0.4, 0, 0.2, 1), transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* حالت فید اوت فوق‌العاده نرم و طولانی */
    #welcomeOverlay.fade-out {
      opacity: 0;
      transform: scale(1.1);
      visibility: hidden;
    }

    /* کانتینر ثابت و شیشه‌ای */
    .welcome-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    /* دکمه ورود به سایت که لرزش دارد */
    .enter-btn {
      padding: 15px 40px;
      background: rgba(56, 189, 248, 0.15);
      border: 2px solid rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      font-size: 18px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
      letter-spacing: 1px;
      pointer-events: none;
      display: inline-block;
      animation: btnShake 0.6s infinite ease-in-out;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .welcome-card:hover .enter-btn {
      background: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.8), inset 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 30px 20px 75px;
    }

    /* بخش بالای صفحه شامل آیکون‌ها و متن وسط آن‌ها */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 320px;
      padding: 0 10px;
    }

    /* استایل آیکون‌های شیشه‌ای و نورانی */
    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(56, 189, 248, 0.1);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .social-icon:hover {
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.3);
      transform: scale(1.08);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* متن وسط بین دو آیکون */
    .header-center-text {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
    }

    /* استایل بخش لوکیشن (Tabriz به همراه آیکون) */
    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    .location-badge svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      flex: 1;
      justify-content: center;
    }

    /* بخش پروفایل و عنوان زیر آن */
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* پروفایل دایره‌ای */
    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
      background-color: #0f172a;
      background-image: url('profile.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* متن کوچک زیر پروفایل */
    .profile-title {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* افکت متن WAVE */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-text {
      display: flex;
      gap: 12px;
    }

    .letter {
      font-size: 75px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
      display: inline-block;
      will-change: transform;
    }

    /* پلیر موزیک با قابلیت چند آهنگ و دکمه بعدی */
    .music-player {
      width: 100%;
      max-width: 340px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2), inset 0 0 10px rgba(56, 189, 248, 0.1);
    }

    /* دکمه‌های کنترلی پلیر */
    .player-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .control-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      transform: scale(1.05);
    }

    .control-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* اطلاعات آهنگ و نوار پیشرفت */
    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-details {
      display: flex;
      justify-content: space-between;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* نوار پیشرفت آهنگ */
    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(56, 189, 248, 0.2);
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- صفحه خوش‌آمدگویی سراسری -->
  <div id="welcomeOverlay" onclick="startSite()">
    <div class="welcome-card">
      <div style="color: #38bdf8; font-size: 24px; font-weight: 900; text-shadow: 0 0 15px rgba(56,189,248,0.8); letter-spacing: 2px;">𝐀𝐦𝐢𝐫𝐀𝐥𝐢 𝐙𝐚𝐫𝐞</div>
      <button class="enter-btn">𝐖𝐞𝐥𝐜𝐨𝐦𝐞 𝐭𝐨 𝐭𝐡𝐞 𝐬𝐢𝐭𝐞</button>
    </div>
  </div>

  <div class="container">
    <!-- بخش بالای صفحه شامل آیکون تلگرام، متن وسط و آیکون اینستاگرام -->
    <div class="header-section">
      <a href="https://www.instagram.com/amira_lizare7?vrfl=MXBncXI1cjhteGE4OQ==" target="_blank" class="social-icon" title="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>

      <div class="header-center-text">I will succeed</div>

      <a href="https://t.me/Amirali_Zare" target="_blank" class="social-icon" title="Telegram">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.166.331.016.12.032.392.016.602z"/></svg>
      </a>
    </div>

    <div class="top-section">
      <!-- بخش لوکیشن جدید -->
      <div class="location-badge">
        <svg viewBox="0 0 24 24"><path d="M12 0C7.58 0 4 3.58 4 8c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
        <span>𝐓𝐚𝐛𝐫𝐢𝐳</span>
      </div>

      <div class="profile-container">
        <div class="profile-avatar"></div>
        <div class="profile-title">[Programmer]</div>
      </div>

      <div class="wave-container">
        <div class="wave-text" id="waveText">
          <span class="letter">R</span>
          <span class="letter">I</span>
          <span class="letter">M</span>
          <span class="letter">A</span>
        </div>
      </div>
    </div>

    <div class="music-player">
      <div class="player-controls">
        <div class="control-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </div>
        <div class="control-btn" onclick="nextTrack()" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </div>
      </div>

      <div class="track-info">
        <div class="track-details">
          <span id="trackTitle">Music 2</span>
          <span id="timeDisplay">3:31 / 0:16</span>
        </div>
        <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
          <div class="progress-fill" id="progressFill" style="width: 70%;"></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
    const letters = document.querySelectorAll('.letter');
    let time = 0;

    function animate() {
      time += 0.04;
      letters.forEach((letter, index) => {
        const yOffset = Math.sin(time + index * 0.8) * 20;
        const rotate = Math.cos(time + index * 0.8) * 8;
        letter.style.transform = `translateY(${yOffset}px) rotate(${rotate}deg)`;
      });
      requestAnimationFrame(animate);
    }

    animate();

    const playlist = [
      { name: "Music 1", src: "music1.mp3" },
      { name: "Music 2", src: "music2.mp3" },
      { name: "Music 3", src: "music3.mp3" }
    ];

    let currentTrackIndex = 1; // تنظیم روی موزیک ۲ مطابق تصویر شما
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressBar = document.getElementById('progressBar');
    const trackTitle = document.getElementById('trackTitle');
    const welcomeOverlay = document.getElementById('welcomeOverlay');

    function loadTrack(index) {
      audio.src = playlist[index].src;
      trackTitle.textContent = playlist[index].name;
      audio.load();
    }

    loadTrack(currentTrackIndex);

    function startSite() {
      audio.play().then(() => {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        // اعمال کلاس محو شدن فوق‌العاده نرم و آهسته (۲.۵ ثانیه)
        welcomeOverlay.classList.add('fade-out');
        setTimeout(() => {
          welcomeOverlay.style.display = 'none';
        }, 2500);
      }).catch(err => {
        console.log("Audio play error:", err);
      });
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        });
      } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().then(() => {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      });
    }

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    function seekAudio(e) {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    audio.addEventListener('loadedmetadata', () => {
      timeDisplay.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
    });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
