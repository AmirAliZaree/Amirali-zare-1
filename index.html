<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AmirAli Zare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 60px 20px 50px;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      margin-auto: auto;
      flex: 1;
      justify-content: center;
    }

    /* پروفایل دایره‌ای */
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
      background-color: #0f172a;
      background-image: url('profile.jpg'); /* عکس هم‌مسیر در گیت‌هاب */
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* افکت متن WAVE */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-text {
      display: flex;
      gap: 12px;
    }

    .letter {
      font-size: 80px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
      display: inline-block;
      will-change: transform;
    }

    /* متن پایین صفحه با رنگ و درخشش هماهنگ با WAVE */
    .bottom-text {
      color: #38bdf8;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8), 0 0 30px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-section">
      <!-- پروفایل دایره‌ای بالای متن -->
      <div class="profile-avatar"></div>

      <!-- متن موجی WAVE -->
      <div class="wave-container">
        <div class="wave-text" id="waveText">
          <span class="letter">R</span>
          <span class="letter">I</span>
          <span class="letter">M</span>
          <span class="letter">A</span>
        </div>
      </div>
    </div>

    <!-- متن پایین صفحه -->
    <div class="bottom-text">
      𝑵𝒆𝒗𝒆𝒓 𝒈𝒊𝒗𝒆 𝒖𝒑, 𝒈𝒓𝒆𝒂𝒕 𝒕𝒉𝒊𝒏𝒈𝒔 𝒕𝒂𝒌𝒆 𝒕𝒊𝒎𝒆
    </div>
  </div>

  <script>
    // انیمیشن موجی
    const letters = document.querySelectorAll('.letter');
    let time = 0;

    function animate() {
      time += 0.04;
      letters.forEach((letter, index) => {
        const yOffset = Math.sin(time + index * 0.8) * 20;
        const rotate = Math.cos(time + index * 0.8) * 8;
        letter.style.transform = `translateY(${yOffset}px) rotate(${rotate}deg)`;
      });
      requestAnimationFrame(animate);
    }

    animate();

    // غیرفعال کردن زوم و اسکرول برای ابعاد کاملاً ثابت
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
