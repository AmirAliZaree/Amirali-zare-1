<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AmirAli Zare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      padding: 30px 20px 40px;
    }

    /* بخش بالای صفحه شامل آیکون‌ها و متن وسط آن‌ها */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 320px;
      padding: 0 10px;
    }

    /* استایل آیکون‌های شیشه‌ای و نورانی */
    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #38bdf8;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(56, 189, 248, 0.1);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .social-icon:hover {
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.3);
      transform: scale(1.08);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* متن وسط بین دو آیکون */
    .header-center-text {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      flex: 1;
      justify-content: center;
    }

    /* بخش پروفایل و عنوان زیر آن */
    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* پروفایل دایره‌ای */
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
      background-color: #0f172a;
      background-image: url('profile.jpg'); /* عکس هم‌مسیر در گیت‌هاب */
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* متن کوچک زیر پروفایل */
    .profile-title {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* افکت متن WAVE */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-text {
      display: flex;
      gap: 12px;
    }

    .letter {
      font-size: 80px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
      display: inline-block;
      will-change: transform;
    }

    /* متن پایین صفحه */
    .bottom-text {
      color: #38bdf8;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.8), 0 0 30px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- بخش بالای صفحه شامل آیکون تلگرام، متن وسط و آیکون اینستاگرام -->
    <div class="header-section">
      <!-- آیکون تلگرام (سمت راست در حالت RTL) -->
      <a href="لینک_تلگرام_شما" target="_blank" class="social-icon" title="Telegram">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.166.331.016.12.032.392.016.602z"/></svg>
      </a>

      <!-- متن وسط بین آیکون‌ها -->
      <div class="header-center-text">𝐈 𝐰𝐢𝐥𝐥 𝐬𝐮𝐜𝐜𝐞𝐞𝐝</div>

      <!-- آیکون اینستاگرام (سمت چپ در حالت RTL) -->
      <a href="لینک_اینستاگرام_شما" target="_blank" class="social-icon" title="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
    </div>

    <div class="top-section">
      <!-- بخش پروفایل همراه با عنوان کوچک Programmer -->
      <div class="profile-container">
        <div class="profile-avatar"></div>
        <div class="profile-title">[𝐏𝐫𝐨𝐠𝐫𝐚𝐦𝐦𝐞𝐫]</div>
      </div>

      <!-- متن موجی WAVE -->
      <div class="wave-container">
        <div class="wave-text" id="waveText">
          <span class="letter">R</span>
          <span class="letter">I</span>
          <span class="letter">M</span>
          <span class="letter">A</span>
        </div>
      </div>
    </div>

    <!-- متن پایین صفحه -->
    <div class="bottom-text">
      my 𝐏𝐫𝐨𝐠𝐫𝐚𝐦𝐦𝐞𝐫
    </div>
  </div>

  <script>
    // انیمیشن موجی
    const letters = document.querySelectorAll('.letter');
    let time = 0;

    function animate() {
      time += 0.04;
      letters.forEach((letter, index) => {
        const yOffset = Math.sin(time + index * 0.8) * 20;
        const rotate = Math.cos(time + index * 0.8) * 8;
        letter.style.transform = `translateY(${yOffset}px) rotate(${rotate}deg)`;
      });
      requestAnimationFrame(animate);
    }

    animate();

    // غیرفعال کردن زوم و اسکرول برای ابعاد کاملاً ثابت
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
