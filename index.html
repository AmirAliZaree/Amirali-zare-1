<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Wave Text Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #080c14;
            color: #E2E8F0;
            overflow: hidden;
            user-select: none;
        }

        .wave-text-container {
            font-family: 'Montserrat', sans-serif;
        }

        /* Glowing text styling */
        .glow-letter {
            display: inline-block;
            color: #38BDF8;
            text-shadow: 
                0 0 10px rgba(56, 189, 248, 0.8),
                0 0 25px rgba(56, 189, 248, 0.6),
                0 0 50px rgba(14, 165, 233, 0.5),
                0 0 90px rgba(14, 165, 233, 0.3);
            will-change: transform, text-shadow;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .glow-letter:hover {
            color: #60A5FA;
            text-shadow: 
                0 0 15px rgba(96, 165, 250, 1),
                0 0 35px rgba(56, 189, 248, 0.9),
                0 0 70px rgba(14, 165, 233, 0.8),
                0 0 120px rgba(14, 165, 233, 0.6);
        }

        /* Ambient glowing background blur */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(14, 165, 233, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: left 0.1s ease-out, top 0.1s ease-out;
            filter: blur(40px);
        }
    </style>
</head>
<body class="min-h-screen h-screen flex justify-center items-center relative overflow-hidden">

    <!-- Mouse follow ambient glow -->
    <div id="ambientGlow" class="ambient-glow left-1/2 top-1/2"></div>

    <!-- Main Display Section -->
    <main class="flex justify-center items-center px-4 z-10">
        <div id="textContainer" class="wave-text-container flex justify-center items-center gap-3 sm:gap-5 md:gap-8 cursor-pointer">
            <!-- Letters injected dynamically via JS -->
        </div>
    </main>

    <script>
        const textContainer = document.getElementById('textContainer');
        const ambientGlow = document.getElementById('ambientGlow');

        const text = "WAVE";
        let letterElements = [];
        let time = 0;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        function createTextElements(str) {
            textContainer.innerHTML = '';
            letterElements = [];
            
            const letters = str.split('');
            letters.forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char === ' ' ? '\u00A0' : char;
                span.className = 'glow-letter text-7xl sm:text-8xl md:text-9xl lg:text-[11rem] font-black tracking-wider';
                
                textContainer.appendChild(span);
                letterElements.push({
                    element: span,
                    baseIndex: index
                });
            });
        }

        function animate() {
            time += 0.035;

            letterElements.forEach((item, index) => {
                const element = item.element;
                const rect = element.getBoundingClientRect();
                const letterCenterX = rect.left + rect.width / 2;
                const letterCenterY = rect.top + rect.height / 2;

                // Mouse impact calculation
                const distX = mouseX - letterCenterX;
                const distY = mouseY - letterCenterY;
                const distance = Math.sqrt(distX * distX + distY * distY);
                
                const maxDist = 200;
                let mouseImpact = 0;
                if (distance < maxDist) {
                    mouseImpact = (1 - distance / maxDist) * 22;
                }

                // Sine wave parameters
                const phaseOffset = index * 0.65;
                const amplitude = 32;
                const yOffset = Math.sin(time + phaseOffset) * amplitude - mouseImpact;
                const rotOffset = Math.cos(time + phaseOffset) * 8;

                element.style.transform = `translateY(${yOffset}px) rotate(${rotOffset}deg)`;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            ambientGlow.style.left = `${e.clientX}px`;
            ambientGlow.style.top = `${e.clientY}px`;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                ambientGlow.style.left = `${mouseX}px`;
                ambientGlow.style.top = `${mouseY}px`;
            }
        });

        window.onload = () => {
            createTextElements(text);
            animate();
        };
    </script>
</body>
</html>
