<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAVE Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
      width: 100%;
      height: 100%;
    }

    /* Circular Profile Container */
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fallback Icon when image is not set */
    .profile-avatar::before {
      content: '';
      width: 40px;
      height: 40px;
      border: 2px dashed #38bdf8;
      border-radius: 50%;
      opacity: 0.4;
      display: var(--placeholder-display, block);
    }

    /* WAVE Text Canvas Container */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wave-text {
      display: flex;
      gap: 12px;
    }

    .letter {
      font-size: 80px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(56, 189, 248, 0.4);
      display: inline-block;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Profile Circle -->
    <div class="profile-avatar" id="profileAvatar"></div>

    <!-- WAVE Text Effect -->
    <div class="wave-container">
      <div class="wave-text" id="waveText">
        <span class="letter">W</span>
        <span class="letter">A</span>
        <span class="letter">V</span>
        <span class="letter">E</span>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ضع رابط الصورة المباشر الخاص بك هنا:
    // ==========================================
    const PROFILE_IMAGE_URL = ''; // مثال: 'https://domain.com/my-photo.jpg'

    const avatarElem = document.getElementById('profileAvatar');
    if (PROFILE_IMAGE_URL && PROFILE_IMAGE_URL.trim() !== '') {
      avatarElem.style.backgroundImage = `url('${PROFILE_IMAGE_URL}')`;
      avatarElem.style.setProperty('--placeholder-display', 'none');
    }

    // Wave Animation Logic
    const letters = document.querySelectorAll('.letter');
    let time = 0;

    function animate() {
      time += 0.04;
      letters.forEach((letter, index) => {
        const yOffset = Math.sin(time + index * 0.8) * 20;
        const rotate = Math.cos(time + index * 0.8) * 8;
        letter.style.transform = `translateY(${yOffset}px) rotate(${rotate}deg)`;
      });
      requestAnimationFrame(animate);
    }

    animate();

    // Prevent interactions/zooming
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
